    <script src="./ext/gl-matrix.js"></script>

    <script type="x-shader/x-vertex" id="vertexshader">
	attribute vec3 aPosition;
	attribute vec3 aNormal;
	
	uniform mat4 uPMatrix;
	uniform mat4 uMVMatrix;
	uniform mat3 uNMatrix;
	
	//uniform vec4 uColor;
	varying vec4 vColor;
				
	// Ambient light.
	uniform vec3 ambientLight;
	
	// Pointlights.
	const int MAX_LIGHT_SOURCES = 8;
	struct LightSource {
		bool isOn;
		vec3 position;
		vec3 color;
	};
	uniform LightSource light[MAX_LIGHT_SOURCES];
	
	// Material.
	struct PhongMaterial {
		vec3 ka;
		vec3 kd;
		vec3 ks;
		float ke; 
	};
	uniform PhongMaterial material;
	
	// Phong illumination for single light source.
	vec3 phong(vec3 p, vec3 n, vec3 v, LightSource l) {
		// Direction from point to light (light.position is in eye coords).
		vec3 L = normalize(l.position - p);
		// Diffuse term
		float NdotL = max(dot(n, L), 0.0);
		vec3 diffuse = material.kd * l.color * NdotL;
		
		// Specular term (only when surface faces light)
		vec3 specular = vec3(0.0);
		if (NdotL > 0.0) {
			// Reflection vector of -L around normal n
			vec3 R = reflect(-L, n);
			float RdotV = max(dot(R, v), 0.0);
			float specFactor = pow(RdotV, material.ke);
			specular = material.ks * l.color * specFactor;
		}
		
		return diffuse + specular;
	}
	
	// Phong illumination for multiple light sources
	vec3 phong(vec3 p, vec3 n, vec3 v) {
		// Calculate ambient light contribution.
		vec3 result = material.ka * ambientLight;
		
		// Add light from all light sources.
		for(int j = 0; j < MAX_LIGHT_SOURCES; j++){
			if(light[j].isOn){
				result += phong(p, n, v, light[j]);
			}
		}
		return result;
	}
	
	void main(){
		// Calculate vertex position in eye coordinates. 
		vec4 tPosition = uMVMatrix * vec4(aPosition, 1.0);
		// Calculate projection.
		gl_Position = uPMatrix * tPosition;
	
		// Transform and normalize normal.
		vec3 tNormal = normalize(uNMatrix * aNormal);
		
		// Calculate view vector (from point towards eye) in eye coords.
		vec3 v = normalize(-tPosition.xyz);	
		
		// Compute final color using Phong illumination (RGB), alpha = 1.
		vColor = vec4( phong(tPosition.xyz, tNormal, v), 1.0);
	}
</script>
    <script type="x-shader/x-fragment" id="fragmentshader">
			precision mediump float;
			
			varying vec4 vColor;
			
			void main() {
				gl_FragColor = vColor;
			}
		</script>
